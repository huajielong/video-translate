<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video-translate · 翻译前后对比</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1100px 560px at 50% -10%, #1b2433 0%, #0b0e14 62%);
    color: #e8edf5; font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    padding: 36px 20px;
  }
  main { width: min(1040px, 100%); }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; letter-spacing: .02em; }
  .lead { margin: 0 0 18px; color: #9aa7b8; font-size: 14px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  figure { margin: 0; }
  .frame {
    position: relative; border-radius: 12px; overflow: hidden; background: #000;
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  video { display: block; width: 100%; height: auto; }
  figcaption {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 10px; color: #9aa7b8; font-size: 13px;
  }
  .tag {
    border-radius: 999px; padding: 2px 10px; font-size: 12px; color: #cfe0ff;
    background: rgba(96,150,255,.16); border: 1px solid rgba(96,150,255,.35);
  }
  .tag.accent { color: #b8f0d8; background: rgba(60,200,150,.14); border-color: rgba(60,200,150,.35); }
  .meta {
    display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
    margin-top: 16px; color: #8b98a9; font-size: 13px;
  }
  .meta a { color: #7fb2ff; text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .hint { margin-top: 12px; color: #6f7d8f; font-size: 12px; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>翻译前后对比</h1>
  <p class="lead">同一段课程画面，两段独立视频：左侧英文原声，右侧中文配音（IndexTTS2 克隆原说话人音色，一行式硬字幕）。分别播放，避免中英文声音重叠。</p>

  <div class="grid">
    <figure>
      <div class="frame">
        <video id="v-before" src="before.mp4" poster="before-poster.jpg" controls playsinline preload="metadata"></video>
      </div>
      <figcaption><span class="tag">原声</span> English original</figcaption>
    </figure>
    <figure>
      <div class="frame">
        <video id="v-after" src="after.mp4" poster="after-poster.jpg" controls playsinline preload="metadata"></video>
      </div>
      <figcaption><span class="tag accent">中文配音</span> 克隆原音色 · 硬字幕</figcaption>
    </figure>
  </div>

  <div class="hint">开始播放一侧时，另一侧会自动暂停。</div>

  <div class="meta">
    <a href="https://github.com/huajielong/video-translate">GitHub 仓库</a>
    <a href="https://github.com/huajielong/video-translate#readme">README</a>
    <a href="before-after.gif">并排对比动图</a>
    <span>课程《面向 AI Agent 与应用的语音技术》Introduction</span>
  </div>
</main>
<script>
  const videos = [document.getElementById('v-before'), document.getElementById('v-after')];

  videos.forEach((video) => {
    video.addEventListener('play', () => {
      videos.forEach((other) => {
        if (other !== video && !other.paused) other.pause();
      });
    });
  });
</script>
</body>
</html>
